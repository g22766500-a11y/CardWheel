<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CardWheel 1.3.1 디자인 미리보기</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#18243d;font-family:system-ui,"Malgun Gothic",sans-serif}header{padding:40px 24px 24px;max-width:1440px;margin:auto}h1{font-size:28px;margin:0 0 12px}p{color:#65718a;line-height:1.6;margin:0 0 20px}.actions{display:flex;gap:8px}button{cursor:pointer;border:0;border-radius:12px;padding:12px 20px;background:white;color:#18243d;font-weight:600}button[aria-pressed=true]{background:#335ceb;color:white}main{max-width:1440px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;padding:0 24px 40px}article{margin:0}h2{font-size:16px;margin:12px 0}img{display:block;width:100%;max-width:390px;border-radius:20px;box-shadow:0 8px 30px #18243d12}body.dark{background:#101724;color:#eef1fa}body.dark p{color:#adb8d0}body.dark button{background:#253246;color:#eef1fa}body.dark button[aria-pressed=true]{background:#a6c4ff;color:#18266b}
</style><header><h1>CardWheel 1.3.1</h1><p>테두리는 줄이고, 카드와 정보가 잘 보이도록 정리했습니다.<br>샘플 데이터를 넣어 앱의 XML 화면을 렌더링한 미리보기입니다. 실제 휴대폰 캡처는 아닙니다.</p><div class="actions"><button aria-pressed="true" onclick="setMode(false)">밝은 화면</button><button aria-pressed="false" onclick="setMode(true)">어두운 화면</button></div></header><main><article><h2>내 카드</h2><img src="main-notnight.png" data-name="main" alt="내 카드 화면" loading="lazy"></article><article><h2>카드 상세</h2><img src="detail-notnight.png" data-name="detail" alt="카드 상세 화면" loading="lazy"></article><article><h2>카드 등록</h2><img src="form-notnight.png" data-name="form" alt="카드 등록 화면" loading="lazy"></article><article><h2>백업과 복원</h2><img src="backup-notnight.png" data-name="backup" alt="백업과 복원 화면" loading="lazy"></article><article><h2>상세 일정과 메모</h2><img src="detail-bottom-notnight.png" data-name="detail-bottom" alt="상세 일정과 메모 화면" loading="lazy"></article><article><h2>날짜 선택과 메모</h2><img src="form-bottom-notnight.png" data-name="form-bottom" alt="날짜 선택과 메모 화면" loading="lazy"></article><article><h2>서버 연결 설정</h2><img src="backup-bottom-notnight.png" data-name="backup-bottom" alt="서버 연결 설정 화면" loading="lazy"></article><article><h2>해지·탈회 완료 카드</h2><img src="main-cancelled-notnight.png" data-name="main-cancelled" alt="해지 완료 카드 화면" loading="lazy"></article></main><script>
function setMode(dark){document.body.classList.toggle('dark',dark);document.querySelectorAll('img[data-name]').forEach(img=>img.src=img.dataset.name+'-'+(dark?'night':'notnight')+'.png');document.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===(dark?1:0))));}
</script></html>
